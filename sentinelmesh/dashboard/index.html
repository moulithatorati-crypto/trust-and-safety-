<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelMesh — Live Decision Console</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #11161f;
    --panel-2: #161d29;
    --border: #232c3a;
    --text: #d7e0ea;
    --muted: #7c8896;
    --accent: #4fd1c5;
    --accent-2: #63b3ed;
    --danger: #f56565;
    --warn: #ecc94b;
    --ok: #48bb78;
    --mono: 'SF Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #0d1219, #0a0e14);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .cfg { display: flex; gap: 8px; align-items: center; }
  .cfg input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: var(--mono);
    width: 220px;
  }
  .cfg button {
    background: var(--accent); border: none; color: #06201d; font-weight: 600;
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  main {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px;
    padding: 22px 28px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .panel h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent-2); margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px;
  }
  .panel h2 .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); }
  button.action {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
    margin-right: 8px; margin-bottom: 8px;
  }
  button.action:hover { border-color: var(--accent); color: var(--accent); }
  textarea {
    width: 100%; min-height: 120px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-family: var(--mono);
    font-size: 12px; padding: 10px; margin-top: 8px;
  }
  .result { margin-top: 12px; font-family: var(--mono); font-size: 12.5px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-weight: 700;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .b-allow, .b-publish { background: rgba(72,187,120,.15); color: var(--ok); }
  .b-step_up_otp, .b-hold, .b-flag { background: rgba(236,201,75,.15); color: var(--warn); }
  .b-prepaid_only { background: rgba(236,201,75,.2); color: var(--warn); }
  .b-block, .b-reject, .b-suppress { background: rgba(245,101,101,.15); color: var(--danger); }
  .reasons { margin-top: 8px; color: var(--muted); }
  .reasons li { margin-bottom: 3px; }
  .score-row { display:flex; align-items:center; gap:10px; margin-top: 6px; }
  .score-bar { flex:1; height: 6px; background: var(--panel-2); border-radius: 4px; overflow:hidden; }
  .score-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .audit-chain { max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .block-card {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer;
    font-family: var(--mono); font-size: 11.5px; background: var(--panel-2);
  }
  .block-card:hover { border-left-color: var(--accent-2); }
  .block-card .hash { color: var(--muted); word-break: break-all; }
  .full-width { grid-column: 1 / -1; }
  .metric-grid { display:flex; gap: 16px; }
  .metric { flex:1; background: var(--panel-2); border-radius: 8px; padding: 12px; text-align:center; }
  .metric .val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .metric .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
  .status-line { font-size: 11px; color: var(--muted); margin-top: 10px; }
  pre.raw { background: var(--panel-2); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 11px; color: var(--muted);}
  .verify-ok { color: var(--ok); font-weight: 700; }
  .verify-bad { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Sentinel<span>Mesh</span> — Live Decision Console</h1>
    <div class="sub">One graph. One audit chain. Three agents. No batch delay.</div>
  </div>
  <div class="cfg">
    <input id="gatewayUrl" value="http://127.0.0.1:8000" />
    <button onclick="checkHealth()">Connect</button>
  </div>
</header>

<main>

  <!-- RISK -->
  <div class="panel">
    <h2><span class="dot"></span> Risk Scoring — Checkout</h2>
    <button class="action" onclick="submitOrder('normal')">Submit normal checkout</button>
    <button class="action" onclick="submitOrder('ring')">Submit ring-device checkout</button>
    <button class="action" onclick="submitOrder('burst')">Submit VPN + burst checkout</button>
    <textarea id="orderPayload"></textarea>
    <div id="riskResult" class="result"></div>
  </div>

  <!-- AUTHENTICITY -->
  <div class="panel">
    <h2><span class="dot"></span> Authenticity — Listing Scan</h2>
    <button class="action" onclick="submitListing('genuine')">Submit genuine listing</button>
    <button class="action" onclick="submitListing('counterfeit')">Submit counterfeit listing</button>
    <textarea id="listingPayload"></textarea>
    <div id="authResult" class="result"></div>
  </div>

  <!-- REVIEWS -->
  <div class="panel">
    <h2><span class="dot"></span> Review Moderation — Batch + Ring Detection</h2>
    <button class="action" onclick="submitReviews('mixed')">Submit mixed batch</button>
    <button class="action" onclick="submitReviews('ring')">Submit coordinated ring batch</button>
    <textarea id="reviewPayload"></textarea>
    <div id="reviewResult" class="result"></div>
  </div>

  <!-- FAIRNESS -->
  <div class="panel">
    <h2><span class="dot"></span> Fairness Metrics</h2>
    <button class="action" onclick="loadFairness()">Refresh /metrics/fairness</button>
    <div id="fairnessResult" class="result"></div>
  </div>

  <!-- AUDIT CHAIN -->
  <div class="panel full-width">
    <h2><span class="dot"></span> Hash-Chained Audit Trail</h2>
    <button class="action" onclick="loadAuditChain()">Refresh chain</button>
    <span id="chainStatus" class="status-line"></span>
    <div class="audit-chain" id="auditChain"></div>
    <div id="auditDetail" class="result"></div>
  </div>

</main>

<script>
let gw = () => document.getElementById('gatewayUrl').value.replace(/\/$/, '');

async function api(path, opts) {
  const res = await fetch(gw() + path, opts);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`${res.status}: ${txt}`);
  }
  return res.json();
}

async function checkHealth() {
  try {
    const r = await api('/', {});
    alert('Connected: ' + r.service + ' (policy ' + r.policy_version + ')');
  } catch (e) {
    alert('Could not reach gateway at ' + gw() + '\n' + e.message);
  }
}

function badge(action) {
  return `<span class="badge b-${action}">${action}</span>`;
}

function scoreBar(score) {
  const pct = Math.round(score * 100);
  return `<div class="score-row"><div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div><span>${score.toFixed(3)}</span></div>`;
}

// ---------------- RISK ----------------
const ORDER_SAMPLES = {
  normal: {
    order_id: "ORD_DEMO_" + Date.now(),
    account_id: "ACC_1", device_id: "DEV_1", ip: "45.10.20.30",
    payment_instrument_id: "PAY_1", shipping_address_id: "ADDR_1",
    order_value: 1200.0, payment_type: "prepaid", category: "apparel",
    session: { duration_seconds: 95, typing_cadence_ms: 140, copy_paste_detected: false },
    billing_country: "IN", timestamp: new Date().toISOString()
  },
  ring: {
    order_id: "ORD_DEMO_" + Date.now(),
    account_id: "ACC_RING_9", device_id: "DEV_RING_1", ip: "45.10.20.99",
    payment_instrument_id: "PAY_RING_1", shipping_address_id: "ADDR_RING_1",
    order_value: 3200.0, payment_type: "cod", category: "electronics",
    session: { duration_seconds: 25, typing_cadence_ms: 45, copy_paste_detected: true },
    billing_country: "IN", timestamp: new Date().toISOString()
  },
  burst: {
    order_id: "ORD_DEMO_" + Date.now(),
    account_id: "ACC_BURST_NEW", device_id: "DEV_BURST_NEW", ip: "203.0.113.99",
    payment_instrument_id: "PAY_BURST_NEW", shipping_address_id: "ADDR_BURST_NEW",
    order_value: 4500.0, payment_type: "cod", category: "electronics",
    session: { duration_seconds: 12, typing_cadence_ms: 30, copy_paste_detected: true },
    billing_country: "US", timestamp: new Date().toISOString()
  }
};

async function submitOrder(kind) {
  const payload = ORDER_SAMPLES[kind];
  payload.order_id = "ORD_DEMO_" + Date.now();
  document.getElementById('orderPayload').value = JSON.stringify(payload, null, 2);
  const el = document.getElementById('riskResult');
  el.innerHTML = 'Submitting…';
  try {
    const r = await api('/risk/evaluate', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    el.innerHTML = `
      ${badge(r.action)} tier: <b>${r.tier}</b> · latency: ${r.latency_ms}ms
      ${scoreBar(r.risk_score)}
      <ul class="reasons">${r.reasons.map(x=>`<li>• ${x}</li>`).join('')}</ul>
      <div class="status-line">audit_id: ${r.audit_id}</div>`;
  } catch (e) {
    el.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

// ------------- AUTHENTICITY -------------
const LISTING_SAMPLES = {
  genuine: {
    listing_id: "LST_DEMO_" + Date.now(), seller_id: "SEL_AUTH_1",
    title: "L'Oreal Revitalift Serum", description: "Genuine L'Oreal serum, sealed box.",
    price: 8499.0, brand: "L'Oreal", category: "cosmetics",
    images: ["REF_LOREAL_A1B2"], gtin: "8901030000001"
  },
  counterfeit: {
    listing_id: "LST_DEMO_" + Date.now(), seller_id: "SEL_UNAUTH_999",
    title: "L'Oreal Revitalift Serum - Clearance", description: "Clearance price, limited stock.",
    price: 1600.0, brand: "L'Oreal", category: "cosmetics",
    images: ["img_counterfeit_scan"], gtin: "8901030000000"
  }
};

async function submitListing(kind) {
  const payload = LISTING_SAMPLES[kind];
  payload.listing_id = "LST_DEMO_" + Date.now();
  document.getElementById('listingPayload').value = JSON.stringify(payload, null, 2);
  const el = document.getElementById('authResult');
  el.innerHTML = 'Submitting…';
  try {
    const r = await api('/authenticity/scan', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    el.innerHTML = `
      ${badge(r.action)}
      ${scoreBar(r.authenticity_score)}
      <ul class="reasons">${r.evidence.map(x=>`<li>• [${x.signal}] ${x.detail}</li>`).join('')}</ul>
      <div class="status-line">audit_id: ${r.audit_id}</div>`;
  } catch (e) {
    el.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

// ---------------- REVIEWS ----------------
function reviewBatchSample(kind) {
  const now = Date.now();
  if (kind === 'mixed') {
    return [
      { review_id: "REV_DEMO_"+now+"_1", account_id: "ACC_1", product_id: "PRD_1",
        device_id: "DEV_1", rating: 5, text: "Works exactly as described, very happy with it.",
        order_id: null, timestamp: new Date().toISOString() },
      { review_id: "REV_DEMO_"+now+"_2", account_id: "ACC_2", product_id: "PRD_2",
        device_id: "DEV_2", rating: 3, text: "Decent for the price, does the job.",
        order_id: null, timestamp: new Date().toISOString() }
    ];
  }
  const reviews = [];
  for (let i = 0; i < 6; i++) {
    reviews.push({
      review_id: `REV_DEMO_${now}_ring_${i}`,
      account_id: `ACC_DEMORING_${i}`,
      product_id: "PRD_REVRING_TARGET",
      device_id: "DEV_DEMORING_SHARED",
      rating: 5,
      text: "Highly recommend! Best product ever, five stars, amazing quality!!!",
      order_id: null,
      timestamp: new Date(now + i * 60000).toISOString()
    });
  }
  return reviews;
}

async function submitReviews(kind) {
  const payload = { reviews: reviewBatchSample(kind) };
  document.getElementById('reviewPayload').value = JSON.stringify(payload, null, 2);
  const el = document.getElementById('reviewResult');
  el.innerHTML = 'Submitting…';
  try {
    const r = await api('/review/moderate', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    let html = '';
    if (r.rings_suppressed && r.rings_suppressed.length) {
      html += `<div class="status-line">🔗 ring(s) suppressed: ${r.rings_suppressed.join(', ')}</div>`;
    }
    html += r.decisions.map(d => `
      <div style="margin-top:8px; border-top:1px solid var(--border); padding-top:6px;">
        ${badge(d.action)} ${d.review_id} ${d.ring_id ? '· ring: '+d.ring_id : ''}
        ${scoreBar(d.authenticity_score)}
        <ul class="reasons">${d.reasons.map(x=>`<li>• ${x}</li>`).join('')}</ul>
      </div>`).join('');
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

// ---------------- FAIRNESS ----------------
async function loadFairness() {
  const el = document.getElementById('fairnessResult');
  el.innerHTML = 'Loading…';
  try {
    const r = await api('/metrics/fairness', {});
    el.innerHTML = `
      <div class="metric-grid">
        <div class="metric"><div class="val">${(r.new?.false_positive_rate*100 || 0).toFixed(1)}%</div><div class="lbl">New accounts FPR</div></div>
        <div class="metric"><div class="val">${(r.established?.false_positive_rate*100 || 0).toFixed(1)}%</div><div class="lbl">Established FPR</div></div>
      </div>
      <div class="status-line">${r.note || ''}</div>
      <pre class="raw">${JSON.stringify(r, null, 2)}</pre>`;
  } catch (e) {
    el.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

// ---------------- AUDIT CHAIN ----------------
async function loadAuditChain() {
  const chainEl = document.getElementById('auditChain');
  const statusEl = document.getElementById('chainStatus');
  chainEl.innerHTML = 'Loading…';
  try {
    const r = await api('/audit?limit=50', {});
    statusEl.innerHTML = r.chain_valid
      ? '<span class="verify-ok">✓ chain intact</span>'
      : '<span class="verify-bad">✗ chain TAMPERED</span>';
    chainEl.innerHTML = r.records.map(rec => `
      <div class="block-card" onclick='showAuditDetail(${JSON.stringify(rec.audit_id)})'>
        <div><b>${rec.agent}</b> → ${rec.entity_type}:${rec.entity_id} → ${badge(rec.action)}</div>
        <div class="hash">hash: ${rec.record_hash.slice(0,24)}… ← prev: ${rec.prev_hash.slice(0,16)}…</div>
        <div>${rec.timestamp}</div>
      </div>`).join('');
  } catch (e) {
    chainEl.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

async function showAuditDetail(auditId) {
  const el = document.getElementById('auditDetail');
  el.innerHTML = 'Loading…';
  try {
    const r = await api('/audit/' + auditId, {});
    el.innerHTML = `<pre class="raw">${JSON.stringify(r, null, 2)}</pre>`;
  } catch (e) {
    el.innerHTML = `<span style="color:var(--danger)">${e.message}</span>`;
  }
}

// init sample payload boxes
document.getElementById('orderPayload').value = JSON.stringify(ORDER_SAMPLES.normal, null, 2);
document.getElementById('listingPayload').value = JSON.stringify(LISTING_SAMPLES.genuine, null, 2);
document.getElementById('reviewPayload').value = JSON.stringify({reviews: reviewBatchSample('mixed')}, null, 2);
</script>

</body>
</html>
